<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicios de Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            padding:8px;
            font-weight: bold;
        }

        th,td {
            border: 1px solid black;
            padding: 10px;
    
        }

        col.cnome {
            background-color: lightblue;
    
        }

        col.csexo {
            background-color: rgb(255, 0, 106);
        }


    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo" span="2">
            <col class="cprofissao">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>João Silva</td>
            <td>M</td>
            <td>25</td>
            <td>Joralista</td>
        </tr>
        <tr>
            <td>Maria Souza</td>
            <td>F</td>
            <td>30</td>
            <td>Advogada</td>
        </tr>
        <tr>
            <td>Carlos Pereira</td>
            <td>M</td>
            <td>28</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Ana Costa</td>
            <td>F</td>
            <td>22</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>Pedro Lima</td>
            <td>M</td>
            <td>35</td>
            <td>Médico</td>
        </tr>
        <tr>
            <td>Juliana Alves</td>
            <td>F</td>
            <td>27</td>
            <td>Professora</td>
        </tr>
    </table>
    
</body>
</html>
