<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 300px;
        }

        td {
            border: 1px solid black;
            padding:10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Exercicios tabelas</h1>
    <table>
        <caption>
            Filmes Favoritos
        </caption>
        <thead>
            <tr>
                <td>GRUPO</td>
                <td>NOMES</td>
                <td colspan="4">FILMES</td>
            </tr>
        </thead>
        <tbody>
            
        </tbody>
    </table>
    
</body>
</html>
