<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 300px;
        }

        td {
            border: 1px solid black;
            padding:10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>GRUPO</td>
            <td>NOMES</td>
            <td colspan="4">FILMES</td>
        </tr>
        <tr>
            <td rowspan="4">MULHERES</td>
            <td>Ana Maria Santos</td>
            <td>Alien</td>
            <td>Rambo</td>
            <td>Vingadores</td> 
        </tr>
        <tr>
            <td rowspan="4">HOMENS</td>
            
        </tr>
        <tr>
            <td rowspan="4">HOMENS</td>
                <td>João Pedro Silva</td>
                <td>O Exorcista</td>
                <td>O Poderoso Chefão</td>
                <td>Clube da Luta</td>
        </tr>
    </table>
    
</body>
</html>
