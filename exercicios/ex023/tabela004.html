<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }
        
        caption {
            font-size: 1.5em;
            margin: 10px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Nomes e tabelas de filme</h1>
    <table>
        <caption>Listas de Usuarios</caption>
        <thead>
            <tr>
                <th scope="col">Grupo</th>
                <th scope="col">Nomes</th>
                <th colspan="3" scope="colgroup">Filmes</th>
            </tr>
        </thead>
        <tfoot>
            <tr>
                <th colspan="4" scope="row">Total</th>
                <th>10000</th>
            </tr>
        </tfoot>
            <tr>
                <th rowspan="3" scope="rowgroup">Mulheres</th>
                <td>Ana Maria Santos</td>
                <td>Allien</td>
                <td>Thor</td>
                <td>Vingadores</td>                
            </tr>
            <tr>
                <td>Maria Clara</td>
                <td>Matrix</td>
                <td>John Wick</td>
                <td>Velocidade Maxima</td>
            </tr>
            <tr>
                <td>Marcela Melo</td>
                <td>Interestelar</td>
                <td>Gravidade</td>
                <td>Perdido em Marte</td>
            </tr>
            <tr>
                <th rowspan="3" scope="rowgroup">Homens</th>
                <td>João Pedro</td>
                <td>Star Wars</td>
                <td>Star Trek</td>
                <td>Guardiões da Galaxia</td>
            </tr>
    </table>

</body>
</html>
