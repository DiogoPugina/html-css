<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Testando Formulario</h1>
    <form action="cadastro.php" method="post">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="iname">Nome:</label>
                <input type="text" name="nome" id="inome" required autocomplete="name" minlength="5" maxlength="20" placeholder="Digite seu nome">
            </p>
            <p>
                <label for="iemail">Email:</label>
                <input type="email" name="email" id="iemail" required autocomplete="email" minlength="8" maxlength="30" placeholder="Digite seu emal" >
            </p>
            <P>
                <label for="iendereco">Endereço</label>
                <input type="text" name="endereco" id="iendereco" required minlength="5" maxlength="40" placeholder="Digite seu endereco">
            </P>
            <p>
                <label for="itelefone">Telefone </label>
                <input type="tel" name="telefone" id="itelefone" required pattern="^(\d{2})\d{4,5}-\d{4}$" placeholder="(xx)xxxx-xxxx">
            </p>
        </fieldset>
        <p>
            <label for="inota">Nota</label>
            <input type="number" name="nota" id="inota" required min="0" max="10" step="0.1">
        </p>
        <p>
            <label for="iperiodo">Periodo:</label>
            <input type="month" name="periodo" id="iperiodo" required >
        </p>
        <p>
            <label for="iprova">Data da Prova:</label>
            <input type="date" name="ano" id="iprova" required>
        </p>
        <p>
            <label for="ihora">Horario da Prova:</label>
            <input type="time" name="hora" id="ihora" required >
        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>

    </form>
    
</body>
</html>
