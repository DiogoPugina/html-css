<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
    <p>
        <label for="icor">Cor</label>
        <input type="color" name="cor" id="icor" value="red" >
    </p>
    <p>
        <label for="inivel">Nivel de Satisfação</label>
        <input type="range" name="nivel" id="inivel" min="1" max="5" >
    </p>
    <p>
        <label for="ifoto">Selecione a Imagem</label>
        <input type="file" name="img" id="ifoto"> 
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="limpar">
    </p>

    <p>
        <label for="inova">Cor secundaria</label>
        <input type="color" name="cor" id="inova" value="blue" >
    </p>

    <p>
        <label for="satis">Nivel de satisfação</label>
        <input type="range" name="nivel" id="satis" min="0" max="10" value="5" >
    </p>

    <p>
        <input type="submit" value="enviar">
        <input type="reset" value="limpar">
    </p>

    </form>
</body>
</html>
